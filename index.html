<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Demo CDN - Cloudflare</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f9f9f9;
      margin: 40px;
    }

    h1 {
      color: #ff6600;
    }

    img, video {
      border-radius: 10px;
      margin-top: 20px;
      max-width: 80%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    video {
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <h1>Demostración del CDN con Cloudflare - Clase Telemática</h1>
  <p>Prueba de página web creada para el CDN.</p>
  <p><strong>Fecha y hora:</strong> <span id="fecha"></span></p>

  <hr>

  <!-- Contenido de baja calidad -->
  <h2>🌍 Imagen servida desde Cloudflare</h2>
  <img src="imagen-cdn.webp" alt="Ejemplo CDN Cloudflare" width="600">

  <h2>🎬 Video de demostración</h2>
  <video controls>
    <source src="video-cdn.mp4" type="video/mp4">
    Tu navegador no soporta la reproducción de video.
  </video>

  <hr>

  <!-- Contenido de alta calidad -->
  <h2>🌍 Imagen 2 servida desde Cloudflare</h2>
  <img src="imagen2-cdn.jpg" alt="Ejemplo CDN Cloudflare" width="600">

  <h2>🎬 Video 2 de demostración</h2>
  <video controls>
    <source src="video2-cdn.mp4" type="video/mp4">
    Tu navegador no soporta la reproducción de video.
  </video>

  <script>
    document.getElementById("fecha").textContent = new Date().toLocaleString();
  </script>
</body>
</html>
